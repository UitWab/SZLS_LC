[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-beam-twin-middleware"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["smart-beam-twin-backend-db==8.0.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend_middleware*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
